; CI compile check for PicoCamera, mirroring the arduino-pico core CI:
;   -Wall -Wextra -Werror -Wdouble-promotion on rp2040 / rp2350 / rp2350-riscv.
;
; Driven by scripts/ci_build.sh, which copies each example into src/ in turn.

[platformio]
src_dir = src

[env]
platform = git+https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
lib_deps =
    symlink://../..
build_flags =
    -Wall
    -Wextra
    -Werror
    -Wdouble-promotion
    -Wno-ignored-qualifiers
extra_scripts =
    pre:extra_script.py

[env:rp2040]
board = rpipico

[env:rp2350]
board = rpipico2

[env:rp2350-riscv]
board = rpipico2
board_build.mcu = rp2350-riscv

; camera_render_to_tft needs TFT_eSPI, which is not -Werror/-Wdouble-promotion
; clean. arduino-pico CI skips the example via .test.skip; here we only check
; that it still compiles, without the strict flags.
[env:tft-rp2040]
board = rpipico
lib_deps =
    symlink://../..
    bodmer/TFT_eSPI
build_flags =
    -Wall
    -Wextra
